[project]
name = "NoteCatcher"
version = "0.1.3"
description = "Keyboard-driven rich text to Markdown note capture"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8,<7", "platformdirs>=4,<5"]

[project.urls]
Homepage = "https://github.com/fikebr/NoteCatcher"
Repository = "https://github.com/fikebr/NoteCatcher"

[project.scripts]
notecatcher = "notecatcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
